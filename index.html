<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAKAFUL SURVIVAL</title>
<style>
:root{--navy:#0a1733;--navy2:#132349;--red:#d4142f;--gold:#d4af6a;--char:#2b2f38;--w:#fff;--mut:#9aa7c4;--ok:#2fbf8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(120% 80% at 50% 0,#1a2f63,var(--navy) 60%);background-color:var(--navy);color:var(--w);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:480px;margin:auto;padding:12px 14px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ib{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:12px;width:38px;height:38px;font-size:16px;cursor:pointer}
#prog{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}
.logo{width:38px;height:38px;border:1.5px dashed var(--gold);border-radius:50%;font-size:8px;display:grid;place-items:center;color:var(--gold);text-align:center;line-height:1}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:20px;padding:16px;margin-bottom:12px}
h1{font-size:34px;letter-spacing:2px;font-weight:900;line-height:1}
h1 b{color:var(--red)}h2{font-size:22px;margin-bottom:6px}h3{font-size:14px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
p,.s{color:var(--mut);font-size:14px;line-height:1.5}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--red),#8f0d20);color:#fff;font-weight:800;font-size:16px;letter-spacing:.5px;cursor:pointer;margin-top:10px;transition:transform .12s,box-shadow .2s;box-shadow:0 8px 22px rgba(212,20,47,.35)}
.btn:active{transform:scale(.95)}.btn.g{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.view{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{cursor:pointer;text-align:center;padding:10px;transition:.2s}.ch:active{transform:scale(.96)}.ch.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.ch svg{width:100%;border-radius:14px}.ch b{display:block;margin-top:6px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:16px;margin-top:6px}
.st{background:rgba(0,0,0,.22);border-radius:14px;padding:11px}.st small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}.st div{font-size:19px;font-weight:800;margin-top:2px}
.bar{height:12px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.wh{position:relative;width:280px;height:280px;margin:14px auto}
#wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--gold);position:relative;transition:transform 4.5s cubic-bezier(.12,.7,.1,1);background:conic-gradient(var(--red) 0 90deg,#1d3c7a 90deg 180deg,var(--char) 180deg 270deg,#8a6a26 270deg 360deg);box-shadow:0 0 40px rgba(212,20,47,.4)}
#wheel span{position:absolute;left:50%;top:50%;width:90px;margin-left:-45px;text-align:center;font-size:12px;font-weight:800;line-height:1.15}
.ptr{position:absolute;left:50%;top:-10px;margin-left:-12px;border:12px solid transparent;border-top:26px solid #fff;z-index:2}
.hub{position:absolute;inset:50% auto auto 50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);z-index:2}
#alert{position:fixed;inset:0;background:#120308;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fl .5s infinite alternate;padding:20px}
@keyframes fl{from{background:#120308}to{background:#4a0714}}
#alert h1{font-size:30px;animation:gl .25s infinite alternate;color:#fff;text-shadow:0 0 20px var(--red)}@keyframes gl{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.tri{font-size:70px;color:var(--red);animation:pu .6s infinite alternate}@keyframes pu{to{transform:scale(1.25)}}
.opt{cursor:pointer;transition:.15s}.opt:active{transform:scale(.97)}.opt b{font-size:17px}.opt .s{margin-top:3px}
.tm{font-size:38px;font-weight:900;text-align:center}.tm.low{color:var(--red);animation:pu .4s infinite alternate}
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--gold) 0deg,rgba(255,255,255,.1) 0)}
.ring div{width:138px;height:138px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-size:44px;font-weight:900}
.bd{display:inline-block;padding:7px 12px;border-radius:99px;background:rgba(212,175,106,.15);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;margin:3px}
.pp{background:linear-gradient(135deg,#1a2f63,#0a1733 60%,#3a0a14);border:1.5px solid var(--gold);border-radius:20px;padding:16px;position:relative}
.qr{width:74px;height:74px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/14px 14px;border:5px solid #fff;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vs .card{margin:0}.bad{border-color:var(--red)}.good{border-color:var(--ok)}
#foot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);background:rgba(10,23,51,.92);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.card img,.card svg{animation:br 4s ease-in-out infinite}@keyframes br{50%{transform:scale(1.02)}}
.shake{animation:sh .6s 3}@keyframes sh{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:11;box-shadow:inset 0 0 140px 40px rgba(212,20,47,.8);opacity:0;transition:opacity 1.2s}
.shield{position:relative}.shield:after{content:"";position:absolute;inset:-6px;border-radius:24px;border:2px solid var(--gold);box-shadow:0 0 30px var(--gold),inset 0 0 30px rgba(212,175,106,.4);animation:sp 1.8s ease-out both;pointer-events:none}@keyframes sp{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:12}
</style></head><body><div id="app">
<header><button class="ib" id="bk" onclick="back()">←</button><div id="prog"><i></i></div><button class="ib" id="mt" onclick="toggleMute(this)">♪</button><div class="logo">LOGO<br>UKM</div></header>
<main id="v"></main></div>
<div id="vig"></div><div id="foot">Simulasi pendidikan sahaja. Semua nilai RM adalah ilustrasi &amp; tidak mewakili manfaat mana-mana produk takaful sebenar.</div>
<script>
const V=document.getElementById('v'),$=s=>document.querySelector(s),fmt=n=>'RM '+Math.round(n).toLocaleString('en-MY');
let AC,mute=false,tmr,S={mode:'player',name:'',ch:null,risk:null,shock:0,gap:0,opt:null,left:60};
function snd(f=440,d=.12,t='sine',v=.07){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function count(el,to,f=fmt,ms=1100){const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/ms);el.textContent=f(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)}
document.addEventListener('click',e=>{if(e.target.closest('.btn,.opt,.ch,.ib'))snd(520,.06,'triangle',.05)});

/* Characters (SVG portraits) */
const C=[
{id:'amir',n:'Amir',r:'Gig Worker / Rider',inc:2800,sav:1500,dep:2,exp:78,fh:42,skin:'#c68e64',bg:['#6b1220','#1a0a10']},
{id:'siti',n:'Siti',r:'Ibu Tunggal',inc:3200,sav:2000,dep:3,exp:82,fh:38,skin:'#d8a47c',bg:['#3b2a5a','#120c22']},
{id:'daniel',n:'Daniel',r:'Eksekutif Swasta',inc:9000,sav:30000,dep:2,exp:55,fh:71,skin:'#dcae82',bg:['#12386b','#0a1733']},
{id:'rahman',n:'Rahman',r:'Hampir Bersara',inc:6500,sav:60000,dep:1,exp:65,fh:64,skin:'#b57f55',bg:['#5a4515','#1a1408']}];
function face(c){if(c.img)return'<img alt="'+c.n+'" src="'+c.img+'" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block">';const k=c.skin,e='<circle cx="49" cy="62" r="2.6" class="eye" fill="#1a1010"/><circle cx="71" cy="62" r="2.6" class="eye" fill="#1a1010"/>',m='<path d="M52 79q8 6 16 0" stroke="#7a2a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>',nose='<path d="M60 64v10q-3 2-5 0" stroke="#0003" stroke-width="1.6" fill="none"/>';
let body,hair='',x='';
if(c.id=='amir'){body='<path d="M8 140q6-42 52-42t52 42z" fill="#c8102e"/><path d="M46 100l14 18 14-18" fill="#fff"/><path d="M60 118v22" stroke="#111" stroke-width="2"/>';hair='<path d="M38 56q2-24 22-24t22 24q-10-12-22-12t-22 12z" fill="#111"/>';x='<path d="M42 78q18 22 36 0" fill="#1113" />'}
if(c.id=='siti'){body='<path d="M6 140q6-44 54-44t54 44z" fill="#b5476b"/>';hair='<path d="M30 70q-4-46 30-46t30 46q0 30-6 42H36q-6-12-6-42z" fill="#e8d3c7"/><path d="M34 70q-2-38 26-38t26 38q0 16-4 26q-22 4-44 0q-4-10-4-26z" fill="#e8d3c7"/>';x='<ellipse cx="60" cy="68" rx="24" ry="27" fill="'+k+'"/>'}
if(c.id=='daniel'){body='<path d="M4 140q8-44 56-44t56 44z" fill="#14243f"/><path d="M44 98l16 22 16-22-8-4h-16z" fill="#fff"/><path d="M60 108l-5 32h10z" fill="#c8102e"/>';hair='<path d="M38 60q-2-28 24-28t22 26q-8-10-20-10q-14 0-26 12z" fill="#15100c"/>';x='<g fill="none" stroke="#222" stroke-width="2"><rect x="39" y="55" width="17" height="13" rx="5"/><rect x="64" y="55" width="17" height="13" rx="5"/><path d="M56 60h8"/></g>'}
if(c.id=='rahman'){body='<path d="M6 140q6-44 54-44t54 44z" fill="#8a6a26"/><path d="M44 98l16 14 16-14" fill="none" stroke="#f0d999" stroke-width="3"/>';hair='<path d="M37 56q0-8 4-10h38q4 2 4 10z" fill="#111"/><rect x="38" y="36" width="44" height="18" rx="4" fill="#111"/><path d="M36 60q-2 8 0 14M84 60q2 8 0 14" stroke="#ddd" stroke-width="5" stroke-linecap="round"/>';x='<path d="M50 74q10-4 20 0q-10 4-20 0" fill="#ddd"/><path d="M42 50q18 6 36 0" stroke="#fff5" stroke-width="1.5" fill="none"/>'}
const head=c.id=='siti'?'':'<ellipse cx="60" cy="66" rx="23" ry="27" fill="'+k+'"/>';
return `<svg viewBox="0 0 120 140"><defs><linearGradient id="g${c.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c.bg[0]}"/><stop offset="1" stop-color="${c.bg[1]}"/></linearGradient></defs><rect width="120" height="140" fill="url(#g${c.id})"/><circle cx="90" cy="30" r="22" fill="#fff1"/><rect x="51" y="86" width="18" height="16" fill="${k}"/>${body}${c.id=='siti'?hair+x:head+hair}${c.id=='siti'?'':''}${e}${nose}${m}${x&&c.id!='siti'?x:''}</svg>`}

/* Risk & options data */
const R=[{n:'Kemalangan',m:4,d:'Kemalangan jalan raya — kos rawatan & hilang pendapatan.'},{n:'Hilang Upaya',m:10,d:'Hilang upaya menyebabkan pendapatan terhenti lama.'},{n:'Kecemasan Keluarga',m:5,d:'Kecemasan perubatan ahli keluarga tanggungan.'},{n:'Kematian Pencari Nafkah',m:15,d:'Keluarga hilang sumber pendapatan utama.'}];
const O=[{n:'Microtakaful',c:20,f:[.6,.15,.2,.15],d:'Sumbangan kecil, perlindungan asas — sesuai untuk risiko kecil.'},{n:'Term Takaful',c:120,f:[.4,.9,.3,1],d:'Tempoh tertentu, tumpuan pada kematian & hilang upaya.'},{n:'Perlindungan Tenang',c:70,f:[.3,.4,.9,.6],d:'Konsep perlindungan keluarga & kecemasan (ilustrasi).'},{n:'Personal Savings',c:0,f:[0,0,0,0],d:'Guna simpanan sendiri — tiada perkongsian risiko.'}];

/* Navigation */
const ORD=['start','mode','pick','dash','wheel','alert','gap','dilemma','decide','compare','quiz','score','passport','learn'];let cur='start';
function go(n){clearInterval(tmr);cur=n;const i=ORD.indexOf(n);$('#prog i').style.width=(i/(ORD.length-1)*100)+'%';$('#bk').style.visibility=(i>=1&&i<=3)?'visible':'hidden';V.className='';void V.offsetWidth;V.className='view';window.scrollTo(0,0);setTense(['alert','gap','dilemma','decide'].includes(n));SC[n]();armIdle()}
function back(){go(ORD[ORD.indexOf(cur)-1])}
const stat=(l,v,i)=>`<div class="st"><small>${l}</small><div ${i?`id="${i}"`:''}>${v}</div></div>`;

const SC={
dilemma(){const ex=Math.round(S.ch.inc*.1/10)*10;S.ex=ex;V.innerHTML=`<div class="card"><h3>Kad Dilema</h3><h2>Lebihan ${fmt(ex)}</h2><p>Sebelum membuat keputusan, anda ada lebihan ${fmt(ex)} bulan ini. Apa pilihan anda?</p></div><div class="card opt" onclick="dl(0)"><b>Simpan sebagai tunai</b><div class="s">Simpanan bertambah — jurang mengecil sedikit.</div></div><div class="card opt" onclick="dl(1)"><b>Rancang lebih awal</b><div class="s">Fokus pada perancangan perlindungan — bonus +6 mata skor.</div></div>`},
quiz(){S.qd=0;S.qok=0;const q=S.q=Q[Math.floor(Math.random()*Q.length)];V.innerHTML=`<div class="card"><h3>Soalan Bonus (+8 mata)</h3><h2>${q.q}</h2></div>${q.a.map((a,i)=>`<div class="card opt" id="qa${i}" onclick="qz(${i})">${a}</div>`).join('')}<div id="qe"></div>`},

start(){V.innerHTML=`<div class="card" style="text-align:center;padding:30px 18px;margin-top:20px"><div class="logo" style="margin:0 auto 14px;width:64px;height:64px;font-size:11px">LOGO<br>UKM</div><h3>Insurance &amp; Takaful · Booth Akademik</h3><h1>TAKAFUL<br><b>SURVIVAL</b></h1><p style="margin:14px 0">Risiko → Jurang Perlindungan → Keputusan → Perlindungan → Skor Survival. Mampukah anda bertahan?</p><button class="btn" onclick="snd(330,.3,'sawtooth',.05);go('mode')">MULA SIMULASI</button></div>`},
mode(){V.innerHTML=`<div class="card"><h2>Mod Permainan</h2><p>Masukkan nama anda dan pilih mod.</p><input id="nm" maxlength="18" placeholder="Nama pemain" value="${S.name}"><button class="btn" onclick="setMode('player')">MOD PEMAIN</button><button class="btn g" onclick="setMode('jury')">MOD JURI (paparan pecahan skor)</button></div>`},
pick(){V.innerHTML=`<h2>Pilih Watak</h2><p style="margin-bottom:10px">Setiap watak mempunyai profil kewangan berbeza. <i>Potret dijana AI; watak fiksyen.</i></p><div class="grid">${C.map((c,i)=>`<div class="card ch ${S.ch==c?'sel':''}" onclick="S.ch=Object.assign({},C[${i}]);S.round=1;S.scores=[];go('dash')">${face(c)}<b>${c.n}</b><span class="s">${c.r}</span></div>`).join('')}</div>`},
dash(){const c=S.ch;V.innerHTML=`<div class="card" style="display:flex;gap:12px;align-items:center"><div style="width:84px">${face(c).replace('<svg','<svg style="border-radius:14px"')}</div><div><h2>${c.n}</h2><p>${c.r}</p></div></div><div class="grid">${stat('Financial Health','0','a1')}${stat('Pendapatan Bulanan','0','a2')}${stat('Tunai / Simpanan','0','a3')}${stat('Tanggungan','0','a4')}${stat('Risk Exposure','0','a5')}${stat('Status Perlindungan','<span style="color:var(--red)">Tiada / Tidak Mencukupi</span>')}</div><div class="card" style="margin-top:12px"><h3>Financial Health</h3><div class="bar"><i id="hb" style="background:linear-gradient(90deg,var(--red),var(--gold))"></i></div></div><button class="btn" onclick="go('wheel')">SEDIA UNTUK RISIKO →</button>`;count($('#a1'),c.fh,n=>Math.round(n)+'/100');count($('#a2'),c.inc);count($('#a3'),c.sav);count($('#a4'),c.dep,n=>Math.round(n)+' orang');count($('#a5'),c.exp,n=>Math.round(n)+'%');setTimeout(()=>$('#hb').style.width=c.fh+'%',80)},
wheel(){V.innerHTML=`<div class="card" style="text-align:center"><h3>Pusingan ${S.round}/3</h3><h2>RISK WHEEL</h2><p>Putar untuk lihat risiko yang menimpa ${S.ch.n}.</p><div class="wh"><div class="ptr"></div><div class="hub"></div><div id="wheel">${R.map((r,i)=>`<span style="transform:rotate(${i*90+45}deg) translateY(-98px) translateX(0)">${r.n.replace(' ','<br>').replace('Kematian<br>Pencari','Kematian<br>Nafkah').replace('Pencari','')}</span>`).join('')}</div></div><button class="btn" id="sp" onclick="spin()">PUTAR!</button></div>`},
alert(){const r=S.risk;const d=document.createElement('div');d.id='alert';d.innerHTML=`<div class="tri">⚠</div><h1>RISK EVENT<br>DETECTED</h1><h2 style="margin-top:16px;color:var(--gold)">${r.n}</h2><p style="max-width:300px">${r.d}</p><div id="pc" style="font-size:34px;font-weight:900;margin-top:12px">RM 0</div>`;document.body.appendChild(d);d.insertAdjacentHTML('afterbegin',CRK);document.body.classList.add('shake');$('#vig').style.opacity=1;count($('#pc'),S.shock,fmt,2200);setTimeout(()=>{document.body.classList.remove('shake');$('#vig').style.opacity=0},2600);let k=0;const b=setInterval(()=>{snd(k++%2?880:660,.15,'square',.06)},260);setTimeout(()=>{clearInterval(b);d.remove();go('gap')},2800)},
gap(){const c=S.ch,r=S.risk,use=c.sav*.5;V.innerHTML=`<div class="card"><h3>${r.n}</h3><h2>Financial Shock</h2><div style="font-size:34px;font-weight:900;color:var(--red)" id="g1">RM 0</div><p>= ${r.m} bulan pendapatan (simulasi)</p></div><div class="card"><h3>Protection Gap Meter</h3><div class="row"><span>Kos kejutan</span><b>${fmt(S.shock)}</b></div><div class="bar"><i style="background:var(--red)" id="m1"></i></div><div class="row"><span>Simpanan boleh guna (50%)</span><b>${fmt(use)}</b></div><div class="bar"><i style="background:var(--ok)" id="m2"></i></div><div class="row"><span style="color:var(--red)">PROTECTION GAP</span><b id="g2" style="color:var(--red);font-size:22px">RM 0</b></div></div><button class="btn" onclick="go('dilemma')">KAD DILEMA →</button>`;count($('#g1'),S.shock);count($('#g2'),S.gap,fmt,1800);snd(140,.6,'sawtooth',.08);setTimeout(()=>{$('#m1').style.width='100%';$('#m2').style.width=Math.min(100,use/S.shock*100)+'%'},100)},
decide(){S.left=60;V.innerHTML=`<div class="tm" id="tm">60</div><div class="bar"><i id="tb" style="background:var(--gold);transition:width 1s linear;width:100%"></i></div><p style="text-align:center;margin-bottom:10px">Gap: <b style="color:var(--red)">${fmt(S.gap)}</b> · Pilih perlindungan anda</p>${O.map((o,i)=>`<div class="card opt" onclick="choose(${i})"><b>${o.n}</b> <span style="float:right;color:var(--gold)">${o.c?'RM '+o.c+'/bln':'RM 0'}</span><div class="s">${o.d}</div></div>`).join('')}`;tmr=setInterval(()=>{S.left--;$('#tm').textContent=S.left;$('#tb').style.width=S.left/60*100+'%';if(S.left<=10){$('#tm').className='tm low';snd(900,.05,'square',.04)}if(S.left<=0){clearInterval(tmr);choose(3)}},1000)},
compare(){const c=S.ch,o=S.opt,y=S.res;const cols=(t,cls,cash,ex)=>`<div class="card ${cls}${cls=='good'&&o!=3?' shield':''}"><h3>${t}</h3><div class="s">Tunai akhir</div><div style="font-size:21px;font-weight:900;color:${cash<0?'var(--red)':'var(--ok)'}" id="${cls}">0</div>${ex}</div>`;V.innerHTML=`<h2 style="text-align:center;margin-bottom:10px">Pusingan ${S.round}/3 · ${O[o].n}</h2><div class="vs">${cols('WHAT IF NOTHING?','bad',y.none,`<p>${y.none<0?'Hutang / pinjaman diperlukan':'Simpanan berkurang teruk'}</p><div class="bar"><i style="background:var(--red)" data-w="${Math.max(3,Math.min(100,(y.none/c.sav)*100))}"></i></div>`)}${cols('WHAT IF PROTECTED?','good',y.prot,`<p>Bayaran ilustrasi: ${fmt(y.pay)}<br>Sumbangan setahun: ${fmt(y.cost)}</p><div class="bar"><i style="background:var(--ok)" data-w="${Math.max(3,Math.min(100,(y.prot/c.sav)*100))}"></i></div>`)}</div><p style="text-align:center;font-size:12px">${o==3?'Personal Savings: tiada perkongsian risiko — semua kos ditanggung sendiri.':'Melalui konsep tabarru’, peserta menderma untuk saling membantu (ilustrasi sahaja).'}</p><button class="btn" onclick="nextR()">${S.round<3?'PUSINGAN SETERUSNYA ('+(S.round+1)+'/3) →':'SOALAN BONUS →'}</button>`;count($('#bad'),y.none);count($('#good'),y.prot);setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),100)},
score(){const y=S.res,jur=S.mode=='jury';V.innerHTML=`<div class="card" style="text-align:center"><h3>TAKAFUL SURVIVAL SCORE</h3><div class="ring" id="rg"><div id="sc">0</div></div><p>/ 100 · ${y.total>=80?'Survivor Cemerlang':y.total>=55?'Bertahan dengan Cabaran':'Terdedah kepada Risiko'}</p></div>${jur?`<div class="card"><h3>Pecahan Skor (Juri)</h3>${y.parts.map(p=>`<div class="row"><span>${p[0]}</span><b>${Math.round(p[1])}/${p[2]}</b></div>`).join('')}</div>`:''}<div class="card"><h3>Achievement Badges</h3>${y.badges.length?y.badges.map(b=>`<span class="bd">★ ${b}</span>`).join(''):'<p>Tiada lencana kali ini — cuba lagi!</p>'}</div><button class="btn" onclick="go('passport')">PLAYER PASSPORT →</button>`;const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/1800),v=y.total*p;$('#sc').textContent=Math.round(v);$('#rg').style.background=`conic-gradient(var(--gold) ${v*3.6}deg,rgba(255,255,255,.1) 0)`;if(p<1)requestAnimationFrame(s)})(t0);(y.total<55?[330,262,196]:[523,659,784,1046]).forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle',.07),i*160));if(y.total>=70)setTimeout(confetti,1200)},

function spin(){const b=$('#sp');b.disabled=true;b.style.opacity=.5;const w=$('#wheel'),deg=360*5+Math.floor(Math.random()*360);w.style.transform=`rotate(${deg}deg)`;let k=0;const t=setInterval(()=>snd(300+k++*4%400,.04,'square',.03),120);setTimeout(()=>{clearInterval(t);const idx=Math.floor(((360-deg%360)%360)/90);S.risk=R[idx];S.shock=S.ch.inc*S.risk.m;S.gap=Math.max(0,S.shock-S.ch.sav*.5);snd(180,.5,'sawtooth',.1);go('alert')},4700)}
function choose(i){clearInterval(tmr);S.opt=i;const c=S.ch,o=O[i],ri=R.indexOf(S.risk),pay=o.f[ri]*S.shock,cost=o.c*12,none=c.sav-S.shock,prot=c.sav-S.shock+pay-cost;
const cover=S.gap>0?Math.min(1,pay/S.gap):1,ratio=o.c/c.inc,parts=[['Perlindungan menutup gap',cover*40,40],['Kemampuan sumbangan',i==3?10:ratio<=.03?25:ratio<=.06?15:5,25],['Kelangsungan tunai',prot>=0?20:Math.max(0,20+prot/S.shock*20),20],['Kelajuan keputusan',Math.min(15,Math.floor(S.left/4)),15]];
const total=Math.min(100,Math.round(parts.reduce((a,p)=>a+p[1],0))+(S.bonus||0));S.bonus=0,badges=[];

/* Firebase Realtime Database (REST). Isi URL untuk leaderboard kongsi; kosongkan = localStorage sahaja */
const FB_URL='';/* contoh: https://NAMA-PROJEK-default-rtdb.asia-southeast1.firebasedatabase.app */
const lbHtml=(l,n)=>l.slice(0,n).map((e,i)=>`<div class="row"><span>${i+1}. ${esc(e.n)} <span class="s">(${esc(e.c)})</span></span><b style="color:var(--gold)">${e.s}</b></div>`).join('')||'<p>Belum ada rekod.</p>';
async function fbAll(){if(!FB_URL)return LB();try{const d=await(await fetch(FB_URL+'/leaderboard.json')).json();return Object.values(d||{}).sort((a,b)=>b.s-a.s)}catch(e){return LB()}}
function fbPost(){if(!FB_URL)return Promise.resolve();return fetch(FB_URL+'/leaderboard.json',{method:'POST',body:JSON.stringify({n:S.name.slice(0,18),s:S.res.total,c:S.ch.n,t:Date.now()})}).catch(()=>{})}
let pend;async function fbShow(n){await pend;const l=await fbAll(),e=$('#lbx');if(e)e.innerHTML=lbHtml(l,n)}
function tv(){document.body.innerHTML='<div style="max-width:900px;margin:auto;padding:30px;text-align:center"><h1 style="font-size:clamp(40px,7vw,80px)">TAKAFUL <b>SURVIVAL</b></h1><h3 style="margin:10px 0 20px;font-size:22px">Live Leaderboard</h3><div id="tvb" class="card" style="font-size:clamp(20px,3vw,34px)"></div></div>';const u=async()=>{const l=await fbAll();$('#tvb').innerHTML=lbHtml(l,10).replace(/class="row"/g,'class="row" style="font-size:inherit;padding:12px 0"')};u();setInterval(u,3000)}
/* Background music: generative ambient pad + arpeggio, tenser during risk phases */
let mus=null,tense=false;function setTense(t){tense=t}
function toggleMute(b){mute=!mute;b.textContent=mute?'✕':'♪';if(mus)mus.m.gain.value=mute?0:.07;else if(!mute)music()}
function music(){if(mus||mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const m=AC.createGain();m.gain.value=.07;m.connect(AC.destination);const pads=[0,1,2].map(()=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';g.gain.value=.5;o.connect(g);g.connect(m);o.start();return o}),CH=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]];let i=0;const tone=(f,d,t,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+d);o.connect(g);g.connect(m);o.start();o.stop(AC.currentTime+d)};(function st(){const ch=CH[(i>>3)%4];if(i%8==0)pads.forEach((o,k)=>o.frequency.setTargetAtTime(ch[k]/2,AC.currentTime,.8));tone(ch[i%3]*(i%2?2:1),.6,'triangle',tense?.5:.35);if(tense&&i%2==0)tone(55,.25,'sine',1.2);if(i%8==0&&!tense)tone(ch[0]/4,2,'sine',.6);i++;setTimeout(st,tense?260:520)})();mus={m}}catch(e){}}
document.addEventListener('pointerdown',music,{once:true});
if(/[?&]tv=1/.test(location.search))tv();else go('start');
</script></body></html>
